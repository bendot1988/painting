[build]
  command = "npm run build"
  publish = "dist"

# Redirect loops (ERR_TOO_MANY_REDIRECTS) usually come from:
# 1. Trailing-slash rules in public/_redirects (/work → /work/) — do not add them.
# 2. Netlify Domain settings fighting each other (www → apex AND apex → www).
#    Pick ONE primary host in Netlify → Domain management. This site uses as-painting.co.uk
#    (www redirects there once). Do not add opposing host redirects here.

[functions]
  directory = "netlify/functions"

# Quote form: browser POSTs to netlify/functions/submit-quote.mjs (Resend).
# Submissions (including blocked spam) are stored in Netlify Blobs.
# Weekly digest: netlify/functions/weekly-submissions-digest.mjs (Mondays 08:00 UTC).
# Inbox login: /.netlify/functions/submissions-inbox (SUBMISSIONS_PASSWORD).
# Set RESEND_API_KEY, RESEND_FROM, RESEND_TO, RESEND_BCC, SUBMISSIONS_PASSWORD in Netlify UI.
# Optional: DIGEST_TO (defaults to RESEND_TO).

[functions."weekly-submissions-digest"]
  schedule = "0 8 * * 1"
